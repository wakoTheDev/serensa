{% extends 'base.html' %}

{% block content %}
<section class="panel">
    <h2>{{ title }}</h2>
    <p class="muted">For Admin role: provide phone number and numeric-only password. Vendors can use username and standard password.</p>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <p class="form-action-row">
            <button class="btn" type="submit">Save User</button>
            <a class="btn btn-alt" href="{% url 'user_list' %}">Cancel</a>
        </p>
    </form>
    {% if target_user %}
    <p class="muted">Forgotten password? <a href="{% url 'user_reset_password' target_user.id %}">Reset password</a></p>
    {% endif %}
</section>
{% endblock %}
