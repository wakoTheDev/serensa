{% extends 'base.html' %}

{% block content %}
<section class="panel">
    <h2>{{ title }}</h2>
    <p class="muted">Set a new password for <strong>{{ target_user.username }}</strong>.</p>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Update Password</button>
    </form>
    <p class="muted"><a href="{% url 'user_edit_role' target_user.id %}">Back to Edit User</a></p>
</section>
{% endblock %}
