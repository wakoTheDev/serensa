name: Production Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    outputs:
      vercel_url: ${{ steps.deploy.outputs.preview_url || steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vercel Secrets
        run: |
          [[ -n "$VERCEL_TOKEN" ]] || { echo "Missing: VERCEL_TOKEN"; exit 1; }
          [[ -n "$VERCEL_ORG_ID" ]] || { echo "Missing: VERCEL_ORG_ID"; exit 1; }
          [[ -n "$VERCEL_PROJECT_ID" ]] || { echo "Missing: VERCEL_PROJECT_ID"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          OUTPUT=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT

      - run: echo "Deployed to Vercel:https://serensa.vercel.app "

  verify-vercel:
    needs: [deploy-vercel]
    runs-on: ubuntu-latest
    steps:
      - name: Wait 2 Minutes
        run: sleep 120

      - name: Health Check Vercel
        run: |
          VERCEL_URL="https://serensa.vercel.app"
          if [[ -z "$VERCEL_URL" ]]; then
            VERCEL_URL="https://serensa.vercel.app"
          fi

          HEALTHCHECK_URL="${VERCEL_URL%/}/healthcheck/"
          echo "Using Vercel healthcheck URL: $HEALTHCHECK_URL"

          for attempt in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL")
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Vercel healthy"
              exit 0
            fi
            echo "Attempt $attempt - HTTP $HTTP_CODE, retrying..."
            sleep 15
          done
          echo "Vercel health check failed"
          exit 1

  deploy-cpanel:
    needs: [deploy-vercel, verify-vercel]
    if: needs.verify-vercel.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate cPanel Secrets
        run: |
          [[ -n "${{ secrets.CPANEL_HOST }}" ]] || exit 1
          [[ -n "${{ secrets.CPANEL_USER }}" ]] || exit 1
          [[ -n "${{ secrets.CPANEL_SFTP_PASSWORD }}" ]] || exit 1
          [[ -n "${{ secrets.CPANEL_DB_NAME }}" ]] || exit 1
          [[ -n "${{ secrets.CPANEL_DB_USER }}" ]] || exit 1
          [[ -n "${{ secrets.CPANEL_DB_PASSWORD }}" ]] || exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r requirements.txt

      - name: Prepare Deployment Package
        run: |
          mkdir -p deploy_package
          cp -r sensa serensa templates static scripts deploy_package/
          cp manage.py requirements.txt passenger_wsgi.py deploy_package/
          cp .htaccess.cpanel.template deploy_package/.htaccess
          sed -i "s|__CPANEL_USER__|${{ secrets.CPANEL_USER }}|g" deploy_package/.htaccess
          cat > deploy_package/.env.cPanel << EOF
          DB_ENGINE=django.db.backends.postgresql
          DJANGO_SECRET_KEY=${{ secrets.CPANEL_DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=0
          DJANGO_ALLOWED_HOSTS=${{ secrets.CPANEL_ALLOWED_HOSTS }}
          DJANGO_CSRF_TRUSTED_ORIGINS=${{ secrets.CPANEL_CSRF_TRUSTED_ORIGINS }}
          DATABASE_URL=postgresql://${{ secrets.CPANEL_DB_USER }}:${{ secrets.CPANEL_DB_PASSWORD }}@localhost:5432/${{ secrets.CPANEL_DB_NAME }}
          EOF

      - name: Deploy via SFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp sshpass
          CPANEL_HOST="${{ secrets.CPANEL_HOST }}"
          CPANEL_PORT="${{ secrets.CPANEL_PORT || 1624 }}"
          CPANEL_USER="${{ secrets.CPANEL_USER }}"
          CPANEL_PASS="${{ secrets.CPANEL_SFTP_PASSWORD }}"
          DEPLOY_PATH="/home/${CPANEL_USER}/serensa_app"
          cat > /tmp/sftp.txt << SFTP_EOF
          set ssl:verify-certificate no
          set sftp:auto-confirm yes
          open sftp://${CPANEL_USER}:${CPANEL_PASS}@${CPANEL_HOST}:${CPANEL_PORT}
          cd ${DEPLOY_PATH}
          mirror -e -R --delete deploy_package .
          bye
          SFTP_EOF
          lftp < /tmp/sftp.txt

      - name: Run Migrations on cPanel
        run: |
          CPANEL_PORT="${{ secrets.CPANEL_PORT || 1624 }}"
          sshpass -p "${{ secrets.CPANEL_SFTP_PASSWORD }}" ssh -p "$CPANEL_PORT" ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "
            cd /home/${{ secrets.CPANEL_USER }}/serensa_app
            if [ -f virtualenv/serensa_app/3.12/bin/activate ]; then . virtualenv/serensa_app/3.12/bin/activate; fi
            python manage.py showmigrations --settings=serensa.settings
            python manage.py migrate --noinput --settings=serensa.settings
          "

      - name: Install .htaccess in cPanel web root
        run: |
          CPANEL_PUBLIC_ROOT="${{ secrets.CPANEL_PUBLIC_ROOT }}"
          if [[ -z "$CPANEL_PUBLIC_ROOT" ]]; then
            CPANEL_PUBLIC_ROOT="/home/${{ secrets.CPANEL_USER }}/public_html"
          fi

          CPANEL_PORT="${{ secrets.CPANEL_PORT || 1624 }}"
          sshpass -p "${{ secrets.CPANEL_SFTP_PASSWORD }}" ssh -p "$CPANEL_PORT" ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "
            set -e
            cp /home/${{ secrets.CPANEL_USER }}/serensa_app/.htaccess ${CPANEL_PUBLIC_ROOT}/.htaccess
            echo 'Installed .htaccess at:' ${CPANEL_PUBLIC_ROOT}/.htaccess
            head -n 8 ${CPANEL_PUBLIC_ROOT}/.htaccess
          "

      - name: Restart Passenger App
        run: |
          CPANEL_PORT="${{ secrets.CPANEL_PORT || 1624 }}"
          sshpass -p "${{ secrets.CPANEL_SFTP_PASSWORD }}" ssh -p "$CPANEL_PORT" ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "
            mkdir -p /home/${{ secrets.CPANEL_USER }}/serensa_app/tmp
            touch /home/${{ secrets.CPANEL_USER }}/serensa_app/tmp/restart.txt
          "

      - name: Health Check cPanel
        run: |
          CPANEL_DOMAIN="${{ secrets.CPANEL_DOMAIN || 'serensaenterprises.co.ke' }}"
          HEALTHCHECK_URL="https://${CPANEL_DOMAIN}/healthcheck/"
          for attempt in {1..10}; do
            HTTP_CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" -k "$HEALTHCHECK_URL")
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "cPanel healthy"
              exit 0
            fi
            echo "Attempt $attempt/10 - HTTP $HTTP_CODE"
            sleep 15
          done
          echo "cPanel health check failed"
          exit 1

  deployment-summary:
    needs: [deploy-vercel, verify-vercel, deploy-cpanel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "Mode: full-chain"
          echo "Vercel Deploy: ${{ needs.deploy-vercel.result }}"
          echo "cPanel Deploy: ${{ needs.deploy-cpanel.result }}"