name: Production Deployment Pipeline (Full Chain)

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:

  # -------------------------------
  # Deploy to Vercel
  # -------------------------------
  deploy-vercel:
    runs-on: ubuntu-latest
    outputs:
      vercel_url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Vercel Secrets
        run: |
          [[ -n "$VERCEL_TOKEN" ]] || exit 1
          [[ -n "$VERCEL_ORG_ID" ]] || exit 1
          [[ -n "$VERCEL_PROJECT_ID" ]] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g vercel

      - name: Pull Env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          OUTPUT=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT

  # -------------------------------
  # Verify Vercel
  # -------------------------------
  verify-vercel:
    needs: deploy-vercel
    runs-on: ubuntu-latest

    steps:
      - name: Wait for stabilization
        run: sleep 120

      - name: Health Check
        run: |
          URL="https://serensa.vercel.app/healthcheck/"

          for i in {1..5}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [[ "$CODE" == "200" ]]; then
              echo "Vercel OK"
              exit 0
            fi
            sleep 10
          done

          exit 1

  # -------------------------------
  # Deploy to cPanel
  # -------------------------------
  deploy-cpanel:
    needs: verify-vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate cPanel Secrets
        run: |
          [[ -n "${{ secrets.CPANEL_HOST }}" ]] || exit 1
          [[ -n "${{ secrets.CPANEL_USER }}" ]] || exit 1

      - name: Prepare Package
        run: |
          mkdir -p deploy_package
          cp -r * deploy_package/

      - name: Upload via SFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp

          lftp -e "
          set ssl:verify-certificate no
          open -u ${{ secrets.CPANEL_USER }},${{ secrets.CPANEL_SFTP_PASSWORD }} sftp://${{ secrets.CPANEL_HOST }}
          mirror -R deploy_package /home/${{ secrets.CPANEL_USER }}/serensa_app
          bye
          "

      - name: Run Migrations via SSH
        run: |
          sudo apt-get install -y sshpass

          sshpass -p "${{ secrets.CPANEL_SFTP_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          -p ${{ secrets.CPANEL_SSH_PORT }} \
          ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'EOF'

          cd ~/serensa_app
          python3 -m pip install -r requirements.txt
          python3 manage.py migrate --noinput

          EOF

  # -------------------------------
  # Summary
  # -------------------------------
  summary:
    needs: [deploy-vercel, verify-vercel, deploy-cpanel]
    runs-on: ubuntu-latest

    steps:
      - name: Done
        run: |
          echo " Full chain deployment successful"