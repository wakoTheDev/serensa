name: Production Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Deploy to Vercel
  # ─────────────────────────────────────────────
  deploy-vercel:
    runs-on: ubuntu-latest
    outputs:
      vercel_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vercel Secrets
        run: |
          [[ -n "$VERCEL_TOKEN" ]]      || { echo "Missing: VERCEL_TOKEN";      exit 1; }
          [[ -n "$VERCEL_ORG_ID" ]]     || { echo "Missing: VERCEL_ORG_ID";     exit 1; }
          [[ -n "$VERCEL_PROJECT_ID" ]] || { echo "Missing: VERCEL_PROJECT_ID"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r requirements.txt

      - name: Verify cPanel Secret Availability
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_DB_NAME: ${{ secrets.CPANEL_DB_NAME }}
          CPANEL_DB_USER: ${{ secrets.CPANEL_DB_USER }}
          CPANEL_DB_PASSWORD: ${{ secrets.CPANEL_DB_PASSWORD }}
          CPANEL_DJANGO_SECRET_KEY: ${{ secrets.CPANEL_DJANGO_SECRET_KEY }}
          CPANEL_ALLOWED_HOSTS: ${{ secrets.CPANEL_ALLOWED_HOSTS }}
          CPANEL_CSRF_TRUSTED_ORIGINS: ${{ secrets.CPANEL_CSRF_TRUSTED_ORIGINS }}
        run: |
          set -e
          python - << 'PY'
          import os
          checks = {
              'CPANEL_USER':               os.getenv('CPANEL_USER'),
              'CPANEL_DB_NAME':            os.getenv('CPANEL_DB_NAME'),
              'CPANEL_DB_USER':            os.getenv('CPANEL_DB_USER'),
              'CPANEL_DB_PASSWORD':        os.getenv('CPANEL_DB_PASSWORD'),
              'CPANEL_DJANGO_SECRET_KEY':  os.getenv('CPANEL_DJANGO_SECRET_KEY'),
              'CPANEL_ALLOWED_HOSTS':      os.getenv('CPANEL_ALLOWED_HOSTS'),
              'CPANEL_CSRF_TRUSTED_ORIGINS': os.getenv('CPANEL_CSRF_TRUSTED_ORIGINS'),
          }
          for key, value in checks.items():
              print(f'{key}_SET={bool(value)}')
          pwd = checks['CPANEL_DB_PASSWORD'] or ''
          print(f'CPANEL_DB_PASSWORD_LENGTH={len(pwd)}')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --global vercel@32.0.0 --no-audit --no-fund

      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          OUTPUT=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to Vercel: $URL"

  # ─────────────────────────────────────────────
  # JOB 2 — Verify Vercel deployment
  # ─────────────────────────────────────────────
  verify-vercel:
    needs: [deploy-vercel]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel to stabilise
        run: sleep 10

      - name: Health Check Vercel
        run: |
          VERCEL_URL="https://serensa.vercel.app"
          HEALTHCHECK_URL="${VERCEL_URL%/}/healthcheck/"
          echo "Checking: $HEALTHCHECK_URL"
          for attempt in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL")
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Vercel healthy (HTTP 200)"
              exit 0
            fi
            echo "Attempt $attempt/12 — HTTP $HTTP_CODE, retrying in 15s..."
            sleep 15
          done
          echo "Vercel health check failed after all attempts"
          exit 1

  # ─────────────────────────────────────────────
  # JOB 3 — Deploy to cPanel (only after Vercel passes)
  # ─────────────────────────────────────────────
  deploy-cpanel:
    needs: [deploy-vercel, verify-vercel]
    if: needs.verify-vercel.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate cPanel Secrets
        run: |
          [[ -n "${{ secrets.CPANEL_HOST }}" ]]          || { echo "Missing: CPANEL_HOST";          exit 1; }
          [[ -n "${{ secrets.CPANEL_USER }}" ]]          || { echo "Missing: CPANEL_USER";          exit 1; }
          [[ -n "${{ secrets.CPANEL_SFTP_PASSWORD }}" ]] || { echo "Missing: CPANEL_SFTP_PASSWORD"; exit 1; }
          [[ -n "${{ secrets.CPANEL_DB_NAME }}" ]]       || { echo "Missing: CPANEL_DB_NAME";       exit 1; }
          [[ -n "${{ secrets.CPANEL_DB_USER }}" ]]       || { echo "Missing: CPANEL_DB_USER";       exit 1; }
          [[ -n "${{ secrets.CPANEL_DB_PASSWORD }}" ]]   || { echo "Missing: CPANEL_DB_PASSWORD";   exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r requirements.txt

      - name: Prepare Deployment Package
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_DJANGO_SECRET_KEY: ${{ secrets.CPANEL_DJANGO_SECRET_KEY }}
          CPANEL_ALLOWED_HOSTS: ${{ secrets.CPANEL_ALLOWED_HOSTS }}
          CPANEL_CSRF_TRUSTED_ORIGINS: ${{ secrets.CPANEL_CSRF_TRUSTED_ORIGINS }}
          CPANEL_DB_NAME: ${{ secrets.CPANEL_DB_NAME }}
          CPANEL_DB_USER: ${{ secrets.CPANEL_DB_USER }}
          CPANEL_DB_PASSWORD: ${{ secrets.CPANEL_DB_PASSWORD }}
        run: |
          mkdir -p deploy_package

          # Copy project files
          cp -r sensa serensa templates static scripts deploy_package/
          cp manage.py requirements.txt passenger_wsgi.py deploy_package/

          # Substitute __CPANEL_USER__ placeholder in .htaccess template
          sed "s|__CPANEL_USER__|${CPANEL_USER}|g" .htaccess.cpanel.template > deploy_package/.htaccess

          # Write .env.cPanel using printf '%s' to preserve special characters exactly
          # Do NOT use %q — it shell-escapes values and corrupts passwords
          {
            printf "DB_ENGINE='%s'\n"                   'django.db.backends.postgresql'
            printf "DJANGO_SETTINGS_MODULE='%s'\n"      'serensa.settings'
            printf "DJANGO_SECRET_KEY='%s'\n"           "${CPANEL_DJANGO_SECRET_KEY}"
            printf "DJANGO_DEBUG='%s'\n"                '0'
            printf "DJANGO_ALLOWED_HOSTS='%s'\n"        "${CPANEL_ALLOWED_HOSTS}"
            printf "DJANGO_CSRF_TRUSTED_ORIGINS='%s'\n" "${CPANEL_CSRF_TRUSTED_ORIGINS}"
            printf "DATABASE_URL='%s'\n"                "postgresql://${CPANEL_DB_USER}:${CPANEL_DB_PASSWORD}@localhost:5432/${CPANEL_DB_NAME}"
            printf "DB_USER='%s'\n"                     "${CPANEL_DB_USER}"
            printf "DATABASE_PASSWORD='%s'\n"           "${CPANEL_DB_PASSWORD}"
            printf "POSTGRES_DB='%s'\n"                 "${CPANEL_DB_NAME}"
            printf "POSTGRES_USER='%s'\n"               "${CPANEL_DB_USER}"
            printf "POSTGRES_PASSWORD='%s'\n"           "${CPANEL_DB_PASSWORD}"
            printf "POSTGRES_HOST='%s'\n"               'localhost'
            printf "POSTGRES_PORT='%s'\n"               '5432'
            printf "CPANEL_DB_NAME='%s'\n"              "${CPANEL_DB_NAME}"
            printf "CPANEL_DB_USER='%s'\n"              "${CPANEL_DB_USER}"
            printf "CPANEL_DB_PASSWORD='%s'\n"          "${CPANEL_DB_PASSWORD}"
          } > deploy_package/.env.cPanel

          # Verify the env file was written correctly
          test -s deploy_package/.env.cPanel           || { echo ".env.cPanel is empty"; exit 1; }
            grep -q '^DATABASE_URL=' deploy_package/.env.cPanel       || { echo "DATABASE_URL missing"; exit 1; }
            grep -q '^DB_USER=' deploy_package/.env.cPanel            || { echo "DB_USER missing"; exit 1; }
            grep -q '^DATABASE_PASSWORD=' deploy_package/.env.cPanel  || { echo "DATABASE_PASSWORD missing"; exit 1; }
            grep -q '^POSTGRES_USER=' deploy_package/.env.cPanel       || { echo "POSTGRES_USER missing"; exit 1; }
          grep -q '^POSTGRES_PASSWORD=' deploy_package/.env.cPanel  || { echo "POSTGRES_PASSWORD missing"; exit 1; }
            grep -q '^CPANEL_DB_USER=' deploy_package/.env.cPanel      || { echo "CPANEL_DB_USER missing"; exit 1; }
          grep -q '^CPANEL_DB_PASSWORD=' deploy_package/.env.cPanel || { echo "CPANEL_DB_PASSWORD missing"; exit 1; }
            echo ".env.cPanel verified — db url, username, and password keys present"

            # Verify DB credentials are not empty in the file
          python3 - << 'PY'
          import re, sys
          content = open('deploy_package/.env.cPanel').read()
          checks = {
            'DATABASE_URL': r"^DATABASE_URL='(.*)'$",
            'DB_USER': r"^DB_USER='(.*)'$",
            'DATABASE_PASSWORD': r"^DATABASE_PASSWORD='(.*)'$",
            'POSTGRES_USER': r"^POSTGRES_USER='(.*)'$",
            'POSTGRES_PASSWORD': r"^POSTGRES_PASSWORD='(.*)'$",
            'CPANEL_DB_USER': r"^CPANEL_DB_USER='(.*)'$",
            'CPANEL_DB_PASSWORD': r"^CPANEL_DB_PASSWORD='(.*)'$",
          }
          values = {}
          for key, pattern in checks.items():
            m = re.search(pattern, content, re.MULTILINE)
            if not m or not m.group(1).strip():
              print(f"ERROR: {key} is missing or empty in .env.cPanel")
              sys.exit(1)
            values[key] = m.group(1)

          if '@' not in values['DATABASE_URL'] or ':' not in values['DATABASE_URL']:
            print("ERROR: DATABASE_URL appears malformed")
            sys.exit(1)

          print(f"POSTGRES_USER length in file: {len(values['POSTGRES_USER'])}")
          print(f"POSTGRES_PASSWORD length in file: {len(values['POSTGRES_PASSWORD'])}")
          PY

      - name: Deploy via SFTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass

          CPANEL_HOST="${{ secrets.CPANEL_HOST }}"
          CPANEL_USER="${{ secrets.CPANEL_USER }}"
          CPANEL_PASS="${{ secrets.CPANEL_SFTP_PASSWORD }}"

          # Resolve SSH/SFTP port — fallback to 22 if secret not set
          CPANEL_PORT="${{ secrets.CPANEL_PORT }}"
          CPANEL_PORT="${CPANEL_PORT:-22}"

          DEPLOY_PATH="/home/${CPANEL_USER}/serensa_app"

          lftp -c "
            set cmd:fail-exit yes
            set ssl:verify-certificate no
            set sftp:auto-confirm yes
            open sftp://${CPANEL_USER}:${CPANEL_PASS}@${CPANEL_HOST}:${CPANEL_PORT}
            cd ${DEPLOY_PATH}
            mirror -e -R --delete deploy_package/ .
            put deploy_package/.env.cPanel -o ${DEPLOY_PATH}/.env.cPanel
            put deploy_package/.htaccess -o ${DEPLOY_PATH}/.htaccess
            bye
          "

      - name: Verify .env.cPanel uploaded to cPanel
        run: |
          CPANEL_PORT="${{ secrets.CPANEL_PORT }}"
          CPANEL_PORT="${CPANEL_PORT:-22}"
          sshpass -p "${{ secrets.CPANEL_SFTP_PASSWORD }}" \
            ssh -p "$CPANEL_PORT" \
            -o StrictHostKeyChecking=no \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'ENDSSH'
          set -e
          APP_DIR="/home/$(whoami)/serensa_app"
          test -s "$APP_DIR/.env.cPanel" || { echo ".env.cPanel missing on cPanel"; exit 1; }
          grep -q '^DATABASE_URL=' "$APP_DIR/.env.cPanel" || { echo "DATABASE_URL missing in remote .env.cPanel"; exit 1; }
          grep -q '^DB_USER=' "$APP_DIR/.env.cPanel" || { echo "DB_USER missing in remote .env.cPanel"; exit 1; }
          grep -q '^DATABASE_PASSWORD=' "$APP_DIR/.env.cPanel" || { echo "DATABASE_PASSWORD missing in remote .env.cPanel"; exit 1; }
          echo "Remote .env.cPanel upload verified"
          ENDSSH

      - name: Run Migrations on cPanel
        run: |
          CPANEL_PORT="${{ secrets.CPANEL_PORT }}"
          CPANEL_PORT="${CPANEL_PORT:-22}"

          sshpass -p "${{ secrets.CPANEL_SFTP_PASSWORD }}" \
            ssh -p "$CPANEL_PORT" \
            -o StrictHostKeyChecking=no \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'ENDSSH'
          set -e

          CPANEL_USER=$(whoami)
          VENV="/home/${CPANEL_USER}/virtualenv/serensa_app/3.11/bin/activate"
          APP_DIR="/home/${CPANEL_USER}/serensa_app"

          source "$VENV"
          cd "$APP_DIR"

          # Ensure remote virtualenv matches pinned versions (including Django < 5.2).
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt

          # Load env vars — single-quoted values handled correctly by bash source
          set -a
          source .env.cPanel
          set +a

          # Unset DATABASE_URL so it does not override POSTGRES_* vars
          unset DATABASE_URL

          # Verify password loaded correctly before attempting migration
          python3 - << 'PY'
          import os, sys
          pwd = os.getenv('POSTGRES_PASSWORD') or os.getenv('CPANEL_DB_PASSWORD') or os.getenv('DATABASE_PASSWORD') or ''
          print(f"DB_ENGINE      = {os.getenv('DB_ENGINE')}")
          print(f"POSTGRES_HOST  = {os.getenv('POSTGRES_HOST')}")
          print(f"POSTGRES_USER  = {os.getenv('POSTGRES_USER') or os.getenv('DB_USER')}")
          print(f"HAS_PASSWORD   = {bool(pwd)}")
          print(f"PASSWORD_LEN   = {len(pwd)}")
          if not pwd:
              print("ERROR: No database password found — aborting migration")
              sys.exit(1)
          PY

          # Confirm what Django actually sees (not just the shell env)
          python3 - << 'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'serensa.settings')
          import django
          django.setup()
          from django.db import connections
          db = connections['default'].settings_dict
          print(f"Django DB NAME     : {db.get('NAME')}")
          print(f"Django DB USER     : {db.get('USER')}")
          pwd = db.get('PASSWORD') or ''
          print(f"Django DB HAS PASS : {bool(pwd)}")
          print(f"Django DB PASS LEN : {len(pwd)}")
          print(f"Django DB HOST     : {db.get('HOST')}")
          PY

            # Baseline current in-place DB state; do not replay historical schema creation.
            # This marks unapplied migrations as applied so deployment continues with the live schema.
            python manage.py migrate --fake --noinput --settings=serensa.settings

          python manage.py collectstatic --noinput --settings=serensa.settings
          echo "Migrations and collectstatic completed"
          ENDSSH

      - name: Verify .htaccess in serensa_app
        run: |
          CPANEL_PORT="${{ secrets.CPANEL_PORT }}"
          CPANEL_PORT="${CPANEL_PORT:-22}"

          sshpass -p "${{ secrets.CPANEL_SFTP_PASSWORD }}" \
            ssh -p "$CPANEL_PORT" \
            -o StrictHostKeyChecking=no \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'ENDSSH'
          set -e
          CPANEL_USER=$(whoami)
          APP_DIR="/home/${CPANEL_USER}/serensa_app"

          if [[ ! -s "$APP_DIR/.htaccess" ]]; then
            echo ".htaccess missing or empty; recreating fallback .htaccess in serensa_app"
            {
              printf '%s\n' "PassengerAppRoot /home/${CPANEL_USER}/serensa_app"
              printf '%s\n' 'PassengerBaseURI /'
              printf '%s\n' 'PassengerAppType wsgi'
              printf '%s\n' 'PassengerStartupFile passenger_wsgi.py'
              printf '%s\n' "PassengerPython /home/${CPANEL_USER}/virtualenv/serensa_app/3.11/bin/python"
              printf '%s\n' 'PassengerEnabled on'
              printf '%s\n' ''
              printf '%s\n' '<IfModule mod_rewrite.c>'
              printf '%s\n' '    RewriteEngine On'
              printf '%s\n' '    Options -MultiViews'
              printf '%s\n' '    RewriteRule ^\\.well-known/ - [L]'
              printf '%s\n' '    RewriteCond %{REQUEST_FILENAME} !-f'
              printf '%s\n' '    RewriteCond %{REQUEST_FILENAME} !-d'
              printf '%s\n' '    RewriteRule ^(.*)$ passenger_wsgi.py/$1 [QSA,PT,L]'
              printf '%s\n' '</IfModule>'
            } > "$APP_DIR/.htaccess"
            chmod 644 "$APP_DIR/.htaccess"
          fi

          test -s "$APP_DIR/.htaccess"
          echo "Using .htaccess at: $APP_DIR/.htaccess"
          head -n 12 "$APP_DIR/.htaccess"
          ENDSSH

      - name: Restart Passenger App
        run: |
          CPANEL_PORT="${{ secrets.CPANEL_PORT }}"
          CPANEL_PORT="${CPANEL_PORT:-22}"

          sshpass -p "${{ secrets.CPANEL_SFTP_PASSWORD }}" \
            ssh -p "$CPANEL_PORT" \
            -o StrictHostKeyChecking=no \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "mkdir -p /home/${{ secrets.CPANEL_USER }}/serensa_app/tmp \
             && touch /home/${{ secrets.CPANEL_USER }}/serensa_app/tmp/restart.txt \
             && echo 'Passenger restart triggered'"

      - name: Health Check cPanel
        run: |
          CPANEL_DOMAIN="${{ secrets.CPANEL_DOMAIN }}"
          CPANEL_DOMAIN="${CPANEL_DOMAIN:-serensaenterprises.co.ke}"
          HEALTHCHECK_URL="https://${CPANEL_DOMAIN}/healthcheck/"
          echo "Checking: $HEALTHCHECK_URL"
          for attempt in {1..10}; do
            HTTP_CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" -k "$HEALTHCHECK_URL")
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "cPanel healthy (HTTP 200)"
              exit 0
            fi
            echo "Attempt $attempt/10 — HTTP $HTTP_CODE"
            cat /tmp/health.txt || true
            sleep 15
          done
          echo "cPanel health check failed after all attempts"
          exit 1

  # ─────────────────────────────────────────────
  # JOB 4 — Deployment Summary
  # ─────────────────────────────────────────────
  deployment-summary:
    needs: [deploy-vercel, verify-vercel, deploy-cpanel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "=================================="
          echo "  Production Deployment Summary"
          echo "=================================="
          echo "  Mode        : full-chain"
          echo "  Vercel      : ${{ needs.deploy-vercel.result }}"
          echo "  Vercel Check: ${{ needs.verify-vercel.result }}"
          echo "  cPanel      : ${{ needs.deploy-cpanel.result }}"
          echo "=================================="